name: Walk an app (emulator proof)
# Installs one published app APK on a phone-size emulator (Google APIs, no Play Store) and walks it with a steps list;
# screenshots + UI text + logcat go to Tab's private drop for the proof folders.
on:
  workflow_dispatch:
    inputs:
      app: {description: "app key", required: true}
      apk_url: {description: "public APK URL", required: true}
      steps: {description: "steps file content", required: true}
permissions:
  contents: read
jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Download the APK
      run: |
        mkdir -p dsk-apk && curl -sfL -m 600 -o "dsk-apk/${{ github.event.inputs.app }}-direct-release.apk" "${{ github.event.inputs.apk_url }}"
        ls -la dsk-apk
        printf '%s\n' "${{ github.event.inputs.steps }}" > .github/walk/steps-release.txt
        BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
        $BT/aapt2 dump packagename dsk-apk/*.apk > .github/walk/package.txt; cat .github/walk/package.txt
        $BT/apksigner verify --print-certs dsk-apk/*.apk | head -3
    - name: Free runner disk for the emulator
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium || true
        df -h / | tail -1
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
    - name: Emulator walk
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        profile: pixel_5
        target: google_apis
        arch: x86_64
        ram-size: 3072M
        disk-size: 4096M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: sed -i 's#\.github/direct#.github/walk#g' .github/walk/run-tests.sh && bash .github/walk/run-tests.sh
    - name: Upload results to Tab's private drop
      if: always()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: bash .github/walk/direct-upload.sh /tmp/dsk-out walk_${{ github.event.inputs.app }}_r${{ github.run_number }}
